name: Emscripten Web Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/README.md'
      - '.github/workflows/*'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ./build-web/_deps
          key: build-emscripten-deps

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Verify toolchain
        run: |
          emcc --version
          cmake --version

      - name: Configure CMake
        run: |
          mkdir -p build-web
          cd build-web
          emcmake cmake -DCMAKE_BUILD_TYPE=Release ..

      - name: Build
        run: |
          cd build-web
          cmake --build .

      - name: Prepare Artifact
        run: |
          mkdir -p dist

          echo "Listing build output:"
          ls -R build-web

          # Copy qbert_web output (html/js/wasm/data)
          find build-web -maxdepth 2 -name "qbert_web.*" -exec cp {} dist/ \;

          # Copy your custom HTML files (if any)
          cp web/*.html dist/ || true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

